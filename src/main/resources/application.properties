spring.application.name=aisafe
spring.profiles.active=jpa
aisafe.docs.path=docs
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.datasource.url=jdbc:h2:mem:aisafedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

springdoc.swagger-ui.operations-sorter=alpha

# Maintenance Threshold Alerting (US222)
aisafe.maintenance.threshold.default-flight-hours=300
aisafe.maintenance.threshold.default-days=365

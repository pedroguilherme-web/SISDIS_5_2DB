version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aisafe-rabbitmq
    ports:
      - "5672:5672"     # AMQP broker port for inter-service messaging
      - "15672:15672"   # Management Web UI (Credentials: guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

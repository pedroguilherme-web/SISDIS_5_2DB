$kind: http-request
url: "{{base_url}}/api/network/total-distance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has total distance", () => pm.expect(pm.response.json().totalDistance).to.be.a("number"));
    language: text/javascript
order: 1000

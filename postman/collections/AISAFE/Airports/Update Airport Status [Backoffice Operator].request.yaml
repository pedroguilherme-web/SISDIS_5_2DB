$kind: http-request
url: "{{base_url}}/api/airports/{{airport_iata}}/status"
method: PATCH
headers:
  If-Match: "{{airport_version}}"
body:
  type: json
  content: "{\r\n    \"status\": \"CLOSED\"\r\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Status updated", () => pm.expect(pm.response.json().status).to.equal("CLOSED"));
      pm.test("Has HATEOAS _links", () => {
          const body = pm.response.json();
          pm.expect(body._links).to.exist;
          pm.expect(body._links.self).to.exist;
      });
    language: text/javascript
order: 8000

$kind: http-request
url: "{{base_url}}/api/airports/statistics/busiest"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      var body = pm.response.json();
      pm.test("Returns HAL collection", () => {
          pm.expect(body._embedded).to.exist;
          pm.expect(body._links).to.exist;
      });
      pm.test("Each entry has iataCode and routeCount", () => {
          var items = Object.values(body._embedded)[0];
          items.forEach(entry => {
              pm.expect(entry.iataCode).to.be.a('string');
              pm.expect(entry.routeCount).to.be.a('number');
          });
      });
    language: text/javascript
order: 11000

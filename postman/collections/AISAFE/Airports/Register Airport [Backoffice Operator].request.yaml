$kind: http-request
url: "{{base_url}}/api/airports"
method: POST
body:
  type: json
  content: "{\r

    \    \"iataCode\": \"OPO\",\r

    \    \"name\": \"Francisco Sá Carneiro Airport\",\r

    \    \"city\": \"Porto\",\r

    \    \"country\": \"Portugal\",\r

    \    \"region\": \"Europe\",\r

    \    \"timezone\": \"Europe/Lisbon\",\r

    \    \"latitude\": 41.2481,\r

    \    \"longitude\": -8.6814,\r

    \    \"runways\": [\r

    \        {\r

    \            \"name\": \"03/21\",\r

    \            \"length\": 3480,\r

    \            \"orientation\": \"030/210\"\r

    \        }\r

    \    ]\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Has IATA code", () => pm.expect(pm.response.json().iataCode).to.exist);
      pm.test("Has HATEOAS _links", () => {
          const body = pm.response.json();
          pm.expect(body._links).to.exist;
          pm.expect(body._links.self).to.exist;
      });
    language: text/javascript
order: 2000

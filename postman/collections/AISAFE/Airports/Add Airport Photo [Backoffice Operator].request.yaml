$kind: http-request
url: "{{base_url}}/api/airports/{{airport_iata}}/photos"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: photo
      src:
        - ""
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000

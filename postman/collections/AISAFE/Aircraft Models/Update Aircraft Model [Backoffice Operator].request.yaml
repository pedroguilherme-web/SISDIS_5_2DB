$kind: http-request
url: "{{base_url}}/api/aircraftModels/{{aircraft_model_name}}"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"cruisingSpeed\": 850.5,\r

    \    \"maximumSeatingCapacity\": 195\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      var body = pm.response.json();
      pm.test("Has modelName", () => pm.expect(body.modelName).to.exist);
      pm.test("Has HATEOAS _links", () => pm.expect(body._links).to.exist);
    language: text/javascript
order: 6000

$kind: http-request
url: "{{base_url}}/api/aircraftModels/{{aircraft_model_name}}/image"
method: PATCH
body:
  type: formdata
  content:
    - type: file
      key: image
      src:
        - ""
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000

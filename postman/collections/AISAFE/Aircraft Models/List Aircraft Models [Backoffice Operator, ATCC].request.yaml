$kind: http-request
url: "{{base_url}}/api/aircraftModels"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      var body = pm.response.json();
      pm.test("Returns paged HAL collection", () => {
          pm.expect(body._embedded).to.exist;
          pm.expect(body._links).to.exist;
          pm.expect(body.page.totalElements).to.be.a('number');
      });
    language: text/javascript
order: 4000

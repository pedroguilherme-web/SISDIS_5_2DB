$kind: http-request
url: "{{base_url}}/api/routes/{{route_origin}}/{{route_destination}}/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns HAL collection", () => {
          const body = pm.response.json();
          pm.expect(body._links).to.exist;
          pm.expect(body._links.self).to.exist;
      });
    language: text/javascript
order: 3000

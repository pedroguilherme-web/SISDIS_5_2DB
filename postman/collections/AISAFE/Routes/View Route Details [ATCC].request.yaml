$kind: http-request
url: "{{base_url}}/api/routes/{{route_origin}}/{{route_destination}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has origin and destination", () => {
          const body = pm.response.json();
          pm.expect(body.originIataCode).to.exist;
          pm.expect(body.destinationIataCode).to.exist;
      });
    language: text/javascript
order: 2000

$kind: http-request
url: "{{base_url}}/api/routes"
method: POST
body:
  type: json
  content: "{\r

    \    \"originIataCode\": \"OPO\",\r

    \    \"destinationIataCode\": \"LIS\",\r

    \    \"estimatedFlightTime\": 45,\r

    \    \"minimumRange\": 500.0,\r

    \    \"minimumCapacity\": 100,\r

    \    \"createdBy\": \"atcc\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      var jsonData = pm.response.json();
      pm.test("Has origin and destination", () => {
          pm.expect(jsonData.originIataCode).to.be.a('string');
          pm.expect(jsonData.destinationIataCode).to.be.a('string');
      });
      if (jsonData.originIataCode && jsonData.destinationIataCode) {
          pm.collectionVariables.set("route_origin", jsonData.originIataCode);
          pm.collectionVariables.set("route_destination", jsonData.destinationIataCode);
      }
      if (jsonData.version !== undefined) {
          pm.collectionVariables.set("route_version", String(jsonData.version));
      }
    language: text/javascript
order: 1000

$kind: http-request
url: "{{base_url}}/api/aircrafts/fleet-status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Has totalAircraft", () => pm.expect(body.totalAircraft).to.be.a('number'));
      pm.test("Has statusGroups with all statuses", () => {
          pm.expect(body.statusGroups).to.exist;
          pm.expect(body.statusGroups.data).to.be.an('array');
          pm.expect(body.statusGroups.data.length).to.eql(4);
      });
      pm.test("Has HATEOAS _links", () => pm.expect(body._links).to.exist);
    language: text/javascript
order: 10000

$kind: http-request
url: "{{base_url}}/api/aircrafts/{{aircraft_registration}}/operational-hours"
method: GET
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      var body = pm.response.json();
      pm.test("Has registrationNumber", () => pm.expect(body.registrationNumber).to.exist);
      pm.test("Has totalOperationalHours", () => pm.expect(body.totalOperationalHours).to.be.a('number'));
      pm.test("Has HATEOAS _links", () => pm.expect(body._links).to.exist);
    language: text/javascript
settings: {}
order: 7000

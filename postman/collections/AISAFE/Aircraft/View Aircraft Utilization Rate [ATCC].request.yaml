$kind: http-request
url: "{{base_url}}/api/aircrafts/{{aircraft_registration}}/utilization?startDate=2026-01-03&endDate=2026-06-10"
method: GET
queryParams:
  startDate: 2026-01-03
  endDate: 2026-06-10
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      var body = pm.response.json();
      pm.test("Returns HAL collection", () => {
          pm.expect(body._embedded).to.exist;
          pm.expect(body._links).to.exist;
      });
      var items = Object.values(body._embedded)[0];
      if (items && items.length > 0) {
          pm.test("Each item has date and flightHours", () => {
              pm.expect(items[0].date).to.exist;
              pm.expect(items[0].flightHours).to.be.a('number');
          });
      }
    language: text/javascript
settings: {}
order: 8000

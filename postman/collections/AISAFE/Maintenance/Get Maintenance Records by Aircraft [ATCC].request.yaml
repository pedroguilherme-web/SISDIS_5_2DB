$kind: http-request
url: "{{base_url}}/api/maintenance/records/aircraft/{{aircraft_registration}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns paginated response", () => {
          const body = pm.response.json();
          pm.expect(body.page).to.exist;
          pm.expect(body.page.totalElements).to.be.a('number');
      });
    language: text/javascript
order: 5000

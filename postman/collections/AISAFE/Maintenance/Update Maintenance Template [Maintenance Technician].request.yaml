$kind: http-request
url: "{{base_url}}/api/maintenance/templates/Inspection%20to%20the%20starter%20motor"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"checklist\": [\"starterMotor inspection\", \"Check electrical connections\", \"Test starter sequence\"],\r

    \    \"intervalFlightHours\": 320,\r

    \    \"intervalDays\": 400\r

    }"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000

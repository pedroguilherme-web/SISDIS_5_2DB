$kind: http-request
name: Search Maintenance Records [Maintenance Technician, Supervisor, ATCC, Admin]
url: "{{base_url}}/api/maintenance/records/search?registration={{aircraft_registration}}&page=0&size=20"
method: GET
queryParams:
  registration: "{{aircraft_registration}}"
  page: "0"
  size: "20"
scripts:

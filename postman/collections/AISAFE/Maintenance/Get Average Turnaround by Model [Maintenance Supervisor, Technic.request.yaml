$kind: http-request
name: Get Average Turnaround by Model [Maintenance Supervisor, Technician, ATCC, Admin]
url: "{{base_url}}/api/maintenance/records/turnaround/model/{{aircraft_model_name}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has average turnaround", () => pm.expect(pm.response.json().averageTurnaroundHours).to.exist);
    language: text/javascript
order: 18000

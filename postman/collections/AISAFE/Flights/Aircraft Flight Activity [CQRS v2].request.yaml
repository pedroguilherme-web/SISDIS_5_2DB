$kind: http-request
url: "{{base_url}}/api/v2/flights/aircraft/{{aircraft_registration}}/activity"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has completed flights", () => pm.expect(pm.response.json().completedFlights).to.be.a("number"));
    language: text/javascript
order: 5200

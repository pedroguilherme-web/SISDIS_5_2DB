server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${TLS_KEY_ALIAS:aisafe}

security.jwt.secret=${JWT_SECRET}
security.p2p.jwt.secret=${P2P_JWT_SECRET}
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

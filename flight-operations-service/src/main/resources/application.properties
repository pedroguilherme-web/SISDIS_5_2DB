spring.application.name=flight-operations-service
server.port=${SERVER_PORT:8071}
spring.profiles.active=jpa

security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000

aisafe.security.trusted-networks=${TRUSTED_NETWORKS:127.0.0.1/32,::1/128}

spring.datasource.url=jdbc:h2:mem:${DB_NAME:flight_operations_db_1};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha
aisafe.docs.path=docs
management.endpoints.web.exposure.include=health,info,metrics

services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081,http://localhost:8082,http://localhost:8083}
services.routes.urls=${ROUTES_SERVICE_URLS:http://localhost:8092,http://localhost:8093}

peers.urls=${PEERS_URLS:}

security.p2p.jwt.secret=${P2P_JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
security.p2p.jwt.expiration-ms=300000
p2p.peer-id=${P2P_PEER_ID:flight-operations-1}
p2p.peers=${P2P_PEERS:}

aisafe.messaging.enabled=${AMQP_ENABLED:true}
aisafe.messaging.instance-id=${p2p.peer-id}
aisafe.messaging.flight-queue=aisafe.flights.${aisafe.messaging.instance-id}.flight-read-model
aisafe.messaging.aircraft-queue=aisafe.flights.${aisafe.messaging.instance-id}.aircraft-catalog
aisafe.messaging.route-queue=aisafe.flights.${aisafe.messaging.instance-id}.route-catalog
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
aisafe.outbox.relay-interval=${OUTBOX_RELAY_INTERVAL:PT2S}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.missing-queues-fatal=false
aisafe.catalog.max-age=${CATALOG_MAX_AGE:PT10M}
aisafe.read-model.rebuild-on-startup=${READ_MODEL_REBUILD_ON_STARTUP:true}

aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

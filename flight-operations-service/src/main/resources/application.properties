# A porta exclusiva do teu serviço
server.port=8083

security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-ms=86400000


# Nome da tua base de dados isolada (exemplo usando H2 em memória)
spring.datasource.url=jdbc:h2:mem:flights_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop


# Permite ver a base de dados no browser (localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.application.name=flight-operations-service
server.port=${SERVER_PORT:8071}
spring.profiles.active=jpa

# Security and JWT (alinhado com os outros microsserviços)
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000

# DataSource (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:${DB_NAME:flight_operations_db_1};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console & JPA
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Documentation & Actuator
springdoc.swagger-ui.operations-sorter=alpha
aisafe.docs.path=docs
management.endpoints.web.exposure.include=health,info,metrics

# Inter-Service Communication endpoints
services.aircraft.url=${AIRCRAFT_SERVICE_URL:http://localhost:8081}
services.routes.url=${ROUTES_SERVICE_URL:http://localhost:8091}

# Default peer list for forwarding (Aspect AOP)
peers.urls=${PEERS_URLS:http://localhost:8072}

# P2P Configuration (shared-core alignment)
security.p2p.jwt.secret=${P2P_JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
security.p2p.jwt.expiration-ms=300000
p2p.peer-id=${P2P_PEER_ID:peer-1}
p2p.peers=${P2P_PEERS:}

# Bootstrap Admin Credentials
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
# Porta da instância (8071 por defeito para Instância 1)
server.port=${SERVER_PORT:8071}

# Perfil JPA ativo para carregar os repositórios (@Profile("jpa"))
spring.profiles.active=jpa

# Segredo JWT partilhado entre todos os serviços
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-ms=86400000

# Base de dados H2 isolada por instância
spring.datasource.url=jdbc:h2:mem:${DB_NAME:flight_operations_db_1};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# URLs dos outros microsserviços (Comunicação Inter-Serviços)
services.aircraft.url=${AIRCRAFT_SERVICE_URL:http://localhost:8081}
services.routes.url=${ROUTES_SERVICE_URL:http://localhost:8091}

# Lista de réplicas (Peers) do Flight Operations Service para P2P Forwarding
peers.urls=${PEERS_URLS:http://localhost:8072}

aisafe.bootstrap.admin.username=admin
aisafe.bootstrap.admin.password=admin123
spring.application.name=airports-routes-service
server.port=8082

# P2P Instance Replication Configuration
p2p.peers.urls=
spring.profiles.active=jpa
aisafe.docs.path=docs
services.aircrafts.url=${AIRCRAFTS_SERVICE_URL:http://localhost:8081}
services.flights.url=${FLIGHTS_SERVICE_URL:http://localhost:8083}
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

spring.datasource.url=jdbc:h2:mem:aisafedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha
# P2P authentication
security.p2p.jwt.secret=${P2P_JWT_SECRET}
security.p2p.jwt.expiration-ms=300000
# Local P2P peer identity
p2p.peer-id=${P2P_PEER_ID:peer-1}
p2p.peers=${P2P_PEERS:}
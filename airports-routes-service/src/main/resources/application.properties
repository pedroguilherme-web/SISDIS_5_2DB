spring.application.name=airports-routes-service
server.port=8092

spring.profiles.active=jpa
aisafe.docs.path=docs
services.aircrafts.urls=${AIRCRAFTS_SERVICE_URLS:http://localhost:8071,http://localhost:8072}
services.flights.urls=${FLIGHTS_SERVICE_URLS:http://localhost:8081,http://localhost:8082}
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

spring.datasource.url=jdbc:h2:mem:aisafedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha
# P2P authentication
security.p2p.jwt.secret=${P2P_JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
security.p2p.jwt.expiration-ms=300000
# Local P2P peer identity
p2p.peer-id=${P2P_PEER_ID:peer-1}
p2p.peers=${P2P_PEERS:}

# P2 AMQP integration; enable when the RabbitMQ broker is available.
aisafe.messaging.enabled=${AMQP_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
aisafe.messaging.aircraft-exchange=aisafe.aircraft.events
aisafe.messaging.aircraft-mood-queue=aisafe.airports-routes.aircraft-mood
aisafe.messaging.aircraft-mood-routing-key=aircraft.mood.changed

# Airports and routes domain events
aisafe.messaging.airports-exchange=aisafe.airports.events
aisafe.messaging.airports-routing-key=airports.airport.changed
aisafe.messaging.airports-queue=aisafe.airports.instance.airport-read
aisafe.messaging.routes-exchange=aisafe.routes.events
aisafe.messaging.routes-routing-key=routes.route.changed
aisafe.messaging.routes-queue=aisafe.airports.instance.routes-read
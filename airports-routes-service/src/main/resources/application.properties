spring.application.name=airports-routes-service
server.port=8092

# P2P Instance Replication Configuration
p2p.peers.urls=
spring.profiles.active=jpa
aisafe.docs.path=docs
services.aircrafts.urls=${AIRCRAFTS_SERVICE_URLS:http://localhost:8081,http://localhost:8084,http://localhost:8085,http://localhost:8086}
services.flights.urls=${FLIGHTS_SERVICE_URLS:http://localhost:8083,http://localhost:8087,http://localhost:8088,http://localhost:8089}
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000
aisafe.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
aisafe.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

spring.datasource.url=jdbc:h2:mem:aisafedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha


spring.application.name=aircraft-maintenance-service
server.port=8081
spring.profiles.active=jpa

# Security and JWT
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration-ms=86400000

# Default DataSource (overridden by instance profiles)
spring.datasource.url=jdbc:h2:mem:aircraft_maintenance_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# H2 Console & JPA
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Documentation & Actuator
springdoc.swagger-ui.operations-sorter=alpha
aisafe.docs.path=docs
management.endpoints.web.exposure.include=health,info,metrics

# Maintenance Business Thresholds (US222)
aisafe.maintenance.threshold.default-flight-hours=300
aisafe.maintenance.threshold.default-days=365

# Inter-Service Communication endpoints (Airports/Routes & Flight Operations)
services.flights.url=http://localhost:8071
services.routes.url=${ROUTES_SERVICE_URL:http://localhost:8092}

# Default peer list for forwarding (empty by default, populated in instance profiles)
peers.urls=
